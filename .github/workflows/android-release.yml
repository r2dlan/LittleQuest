name: Signed Android release build
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17.0.21+9"
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - id: gradle
        run: echo "version=$(cat android/gradle-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Build with upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/littlequest-upload.jks
        run: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.ANDROID_KEYSTORE_PATH, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, "base64"), { mode: 0o600 });'
          npm run android:release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/LittleQuest-release.apk
          jarsigner -verify dist/LittleQuest.aab
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: LittleQuest-signed-${{ github.run_number }}
          path: |
            dist/LittleQuest-release.apk
            dist/LittleQuest.aab
          if-no-files-found: error
          retention-days: 14
    needs: build
  build:
    name: Build matching app and container
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ inputs.ref }}
      artifact-name: LittleQuest-signed-preparation-${{ github.run_number }}
