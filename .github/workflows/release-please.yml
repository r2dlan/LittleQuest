name: Release Please
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to rebuild APK, AAB and container (optional)
        type: string
        required: false
      deploy-pages:
        description: Also deploy the selected release to Cloudflare production (may roll back the site)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.existing.outputs.tag || steps.release.outputs.tag_name }}
      created: ${{ steps.existing.outputs.created || steps.release.outputs.release_created }}
    steps:
      - name: Check release bot credentials
        if: ${{ !inputs.release-tag }}
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::Configure RELEASE_PLEASE_TOKEN so release PRs trigger their checks.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        if: ${{ !inputs.release-tag }}
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: Select existing release for rebuild
        if: ${{ inputs.release-tag }}
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag=$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'created=true' >> "$GITHUB_OUTPUT"
  upload:
    needs:
      - release
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.android-artifact }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.container-artifact }}
          path: dist
      - name: Attach tested Android files and container to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/LittleQuest.apk dist/LittleQuest-unsigned.aab dist/LittleQuest-container.tar.gz --clobber
  build:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      artifact-name: LittleQuest-${{ needs.release.outputs.tag }}
      release-tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write
  pages:
    name: Deploy released game to Cloudflare Pages
    needs:
      - release
      - build
      - upload
    if: ${{ needs.release.outputs.created == 'true' && github.ref == 'refs/heads/main' && (!inputs.release-tag || inputs.deploy-pages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          : "${CLOUDFLARE_API_TOKEN:?Configure repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure repository secret CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Configure Pages project name}"
          printf '%s' "$CLOUDFLARE_PAGES_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]*$'
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-fA-F0-9]{32}$'
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare exact release assets and offline cache
        env:
          BUILD_RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/prepare-pages.mjs
      - name: Publish production release
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          wranglerVersion: 4.148.0
          command: pages deploy dist/pages --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ needs.build.outputs.revision }} --commit-message=${{ needs.release.outputs.tag }} --commit-dirty=false
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'littlequest' }}
