name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to rebuild APK, AAB and container (optional)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.existing.outputs.tag || steps.release.outputs.tag_name }}
      created: ${{ steps.existing.outputs.created || steps.release.outputs.release_created }}
    steps:
      - name: Check release bot credentials
        if: ${{ !inputs.release-tag }}
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::Configure RELEASE_PLEASE_TOKEN so release PRs trigger their checks.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        if: ${{ !inputs.release-tag }}
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
      - name: Select existing release for rebuild
        if: ${{ inputs.release-tag }}
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag=$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'created=true' >> "$GITHUB_OUTPUT"
  apk:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      artifact-name: LittleQuest-${{ needs.release.outputs.tag }}
  upload:
    needs: [release, apk, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LittleQuest-${{ needs.release.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: LittleQuest-Container-${{ needs.release.outputs.tag }}
          path: dist
      - name: Attach tested Android files and container to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/LittleQuest.apk dist/LittleQuest-unsigned.aab dist/LittleQuest-container.tar.gz --clobber

  container:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.release.outputs.tag }}
      artifact-name: LittleQuest-Container-${{ needs.release.outputs.tag }}
      release-tag: ${{ needs.release.outputs.tag }}
