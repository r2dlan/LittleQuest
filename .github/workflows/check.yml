name: Little Quest app and container
on:
  push:
    paths:
      - web/**
      - android/**
      - sync-android.mjs
      - scripts/build-android.sh
      - package.json
      - package-lock.json
      - .github/workflows/check.yml
      - .github/workflows/release-please.yml
      - .github/workflows/android-release.yml
      - .github/release-please-config.json
      - server.mjs
      - Dockerfile
      - .dockerignore
      - tests/**
      - scripts/cleanup-github.mjs
      - .github/workflows/cleanup.yml
      - biome.json
      - scripts/build-metadata.mjs
      - '!**/*.md'
  pull_request:
    paths:
      - web/**
      - android/**
      - sync-android.mjs
      - scripts/build-android.sh
      - package.json
      - package-lock.json
      - .github/workflows/check.yml
      - .github/workflows/release-please.yml
      - .github/workflows/android-release.yml
      - .github/release-please-config.json
      - server.mjs
      - Dockerfile
      - .dockerignore
      - tests/**
      - scripts/cleanup-github.mjs
      - .github/workflows/cleanup.yml
      - biome.json
      - scripts/build-metadata.mjs
      - '!**/*.md'
  workflow_dispatch: null
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      artifact-name:
        type: string
        required: true
      release-tag:
        type: string
        required: false
        default: ""
    outputs:
      revision:
        description: revision
        value: ${{ jobs.check.outputs.revision }}
      version:
        description: version
        value: ${{ jobs.check.outputs.version }}
      android-artifact:
        description: android-artifact
        value: ${{ jobs.check.outputs.android-artifact }}
      container-artifact:
        description: container-artifact
        value: ${{ jobs.check.outputs.container-artifact }}
concurrency:
  group: build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.release-tag }}
permissions:
  contents: read
jobs:
  check:
    name: Code quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Resolve shared commit and project version
        id: metadata
        env:
          BUILD_RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/build-metadata.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify Android assets match the game
        run: |
          npm run android:assets
          git diff --exit-code -- android/app/src/main/assets
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
      image-tag: ${{ steps.metadata.outputs.image-tag }}
      android-artifact: ${{ format('{0}-Android', inputs.artifact-name || steps.metadata.outputs.artifact-prefix) }}
      container-artifact: ${{ format('{0}-Container', inputs.artifact-name || steps.metadata.outputs.artifact-prefix) }}
  android:
    name: Build versioned Android APK and AAB
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Read Gradle version
        id: gradle
        run: echo "version=$(cat android/gradle-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}
      - name: Build installable debug APK
        run: npm run android:build
      - name: Build unsigned release App Bundle for store preparation
        run: npm run android:bundle
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/LittleQuest.apk'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check.outputs.android-artifact }}
          path: |
            dist/LittleQuest.apk
            dist/LittleQuest-unsigned.aab
          if-no-files-found: error
          retention-days: 14
  container:
    name: Build and test playable container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.revision }}
          persist-credentials: false
      - name: Enable multi-platform Docker image storage
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Enable ARM64 execution
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up multi-platform builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Build both platforms from shared revision
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: littlequest:local
          labels: |-
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.check.outputs.revision }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
      - name: Verify gameplay and privacy files on both platforms
        run: |
          set -eu
          trap 'docker logs littlequest-test 2>/dev/null || true; docker rm --force littlequest-test 2>/dev/null || true' EXIT
          for platform in linux/amd64 linux/arm64; do
            docker run --detach --platform "$platform" --name littlequest-test --publish 127.0.0.1:4173:4173 littlequest:local
            # Port forwarding may reset connections while Node starts.
            curl --fail --retry 30 --retry-all-errors --retry-delay 1 --retry-max-time 45 --connect-timeout 2 --max-time 5 http://127.0.0.1:4173/ --output /tmp/game.html
            grep -q 'game.js' /tmp/game.html
            expected_arch=x64
            if [ "$platform" = linux/arm64 ]; then expected_arch=arm64; fi
            test "$(docker exec littlequest-test node -p process.arch)" = "$expected_arch"
            for file in game.js quest.js world.js settings.js sw.js privacy.html privacy-details.json; do
              curl --fail "http://127.0.0.1:4173/$file" --output /dev/null
            done
            docker logs littlequest-test
            docker rm --force littlequest-test
          done
      - name: Export startable Docker image
        run: |
          set -eu
          mkdir -p dist
          docker save --output dist/LittleQuest-container.tar littlequest:local
          gzip dist/LittleQuest-container.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check.outputs.container-artifact }}
          path: dist/LittleQuest-container.tar.gz
          if-no-files-found: error
          retention-days: 14
    needs: check
  publish:
    name: Publish tested image to GitHub Packages
    needs:
      - check
      - android
      - container
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (inputs.release-tag != '' || !inputs.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Enable multi-platform Docker image storage
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.check.outputs.container-artifact }}
          path: dist
      - name: Load and tag tested image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.check.outputs.revision }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          IMAGE_TAG: ${{ needs.check.outputs.image-tag }}
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker load --input dist/LittleQuest-container.tar.gz
          docker tag littlequest:local "$image:sha-$REVISION"
          docker tag littlequest:local "$image:$IMAGE_TAG"
          if [ -z "$RELEASE_TAG" ]; then
            docker tag littlequest:local "$image:latest"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Publish image
        env:
          REVISION: ${{ needs.check.outputs.revision }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -eu
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:$IMAGE_TAG"
          if [ -z "$RELEASE_TAG" ]; then
            docker push "$IMAGE:latest"
          fi
      - name: Verify published multi-platform index
        run: docker buildx imagetools inspect --raw "$IMAGE:$IMAGE_TAG" | node --input-type=module -e 'import assert from "node:assert/strict"; let raw = ""; for await (const chunk of process.stdin) raw += chunk; const index = JSON.parse(raw); const platforms = index.manifests.map(m => `${m.platform.os}/${m.platform.architecture}`).sort(); assert.deepEqual(platforms, ["linux/amd64", "linux/arm64"]);'
    concurrency:
      group: littlequest-package-mutations
      cancel-in-progress: false
