plugins { id 'com.android.application' }
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
if (versionParts.size() != 3 || versionParts.any { it < 0 } || versionParts[0] > 2100 || versionParts[1] > 999 || versionParts[2] > 999) {
    throw new GradleException('App version must use major.minor.patch with major <= 2100, minor/patch <= 999')
}
android {
    namespace 'de.r2dlan.littlequest'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'de.r2dlan.littlequest'
        minSdk 26
        targetSdk 36
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName appVersion
    }
    def signingKeys = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
    def signingValues = signingKeys.collect { System.getenv(it) }
    if (signingValues.any { it } && !signingValues.every { it }) {
        throw new GradleException('Provide all four Android signing environment variables or none')
    }
    if (signingValues.every { it }) {
        signingConfigs {
            release {
                storeFile file(signingValues[0])
                storePassword signingValues[1]
                keyAlias signingValues[2]
                keyPassword signingValues[3]
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (signingValues.every { it }) signingConfig signingConfigs.release
        }
    }
}
